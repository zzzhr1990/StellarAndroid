name: Android Release

on:
  push:
    branches: [release]

permissions:
  contents: read

# Each push gets its own release, including when another build is still running.
concurrency:
  group: android-release-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ARM64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set release version
        id: version
        run: |
          base_version=$(sed -n 's/^appVersionName=//p' gradle.properties)
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${base_version}+${GITHUB_RUN_NUMBER}"
          tag="v${base_version}-build.${GITHUB_RUN_NUMBER}"
          # Keep CI versions above the default local versionCode.
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native/requirements.txt

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Install build tools and Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config perl
          python -m pip install -r native/requirements.txt
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes 2>/dev/null || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;4.1.2'
          echo "$ANDROID_HOME/cmake/4.1.2/bin" >> "$GITHUB_PATH"

      - name: Cache native libraries
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/prefix/arm64-v8a
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-ndk29-${{ hashFiles('native/build.py', 'native/requirements.txt', 'native/sources.json', 'native/archives/**', 'native/vendor/**') }}

      - name: Build native dependencies from source
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python native/build.py

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for setting in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing repository secret: $setting"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stellar-release.p12"

      - name: Build Debug APK, signed Release APK and bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/stellar-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_API_KEY: ${{ secrets.TRAKT_API_KEY }}
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" \
            :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/stellar-release.p12"

      - name: Verify signatures and prepare release assets
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/bundle-verification.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/bundle-verification.txt"
          mkdir -p dist
          asset="StellarAndroid-${RELEASE_TAG}-arm64-v8a"
          cp app/build/outputs/apk/release/app-release.apk "dist/${asset}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${asset}-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/${asset}-release.aab"
          git archive --format=tar.gz --prefix="StellarAndroid-${RELEASE_TAG}/" \
            --output="dist/StellarAndroid-${RELEASE_TAG}-source.tar.gz" "$GITHUB_SHA"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          python tools/release_notes.py
          (cd dist && sha256sum ./* > SHA256SUMS.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: dist/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: android-release-publish
      cancel-in-progress: false
      # Preserve every pending publication instead of replacing it with the next push.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
      queue: max
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      APP_VERSION_NAME: ${{ needs.build.outputs.version }}
    steps:
      - name: Download verified build assets
        run: gh run download "$GITHUB_RUN_ID" --name android-release --dir dist

      - name: Publish all assets together
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          # A rerun may resume a draft, but must never replace an existing public release.
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' release.json)" != true ]]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
              --title "StellarAndroid $APP_VERSION_NAME" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          # An older build finishing late must not replace a newer build as Latest.
          latest_number=$(gh release view --json tagName --jq '.tagName' 2>/dev/null | sed -n 's/.*-build\.\([0-9][0-9]*\)$/\1/p' || true)
          latest=true
          if [[ -n "$latest_number" && "$latest_number" -gt "$GITHUB_RUN_NUMBER" ]]; then
            latest=false
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
          echo "Published: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
